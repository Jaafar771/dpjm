[functions.login-by-username]
# The function receives username/password itself and establishes the Supabase session.
# It must accept the unauthenticated login request and its CORS preflight request.
verify_jwt = false

[functions.notify-employee]
# This function is callable only from trusted server/admin workflows using a
# secret key. User-visible notifications are also generated by DB triggers.
verify_jwt = true

[functions.schedule-planner]
# The planner is an admin-only action; it uses the caller's JWT to verify this.
verify_jwt = true

[functions.manage-schedule]
# Manual changes use the same authenticated admin-only rules as AI planning.
verify_jwt = true
