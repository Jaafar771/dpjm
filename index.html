<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Verhindert unerwünschtes Rauszoomen & fixiert die App-Skalierung auf Handys -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- UI/Theme-Anpassungen für Smartphones (Dunkler Statusleisten-Look) -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Dienstplan Portal</title>

    <!-- Performance-Optimierung für externe Schriften -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

    <!-- FontAwesome Icons -->
    <link
            crossorigin="anonymous"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
            referrerpolicy="no-referrer"
            rel="stylesheet"
    />

    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
<!-- Mount-Point für deine Vue.js App -->
<div id="app"></div>

<!-- Vite Entrypoint -->
<script type="module" src="/src/main.js"></script>
</body>
</html>
